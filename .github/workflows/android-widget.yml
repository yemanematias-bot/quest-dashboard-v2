name: Android widget preview
on:
  push:
    branches: [android-daily-widget]
    paths: ['android/**', '.github/workflows/android-widget.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android-widget.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - run: python android/prepare_assets.py
      - run: gradle -p android assembleDebug lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: quest-widgets-preview-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-lint-report
          path: android/app/build/reports/lint-results-debug.html
